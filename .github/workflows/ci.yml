name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check wildcard dependencies
        run: npm run check:no-wildcard-deps

      - name: Check controller route prefixes
        run: npm run check:controller-prefixes
      - name: Check .env.example covers the env schema
        run: npm run check:env-example
      - name: Check AppModule imports resolve
        run: npm run check:app-module-imports

      - name: Security guard tests
        run: npm run test:security
      - name: Check for undeclared dependencies
        run: npm run check:deps

      - name: Check scheduled jobs use ClusterCron
        run: npm run check:cron

      - name: Run Linter
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit || true

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests || true
