name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check wildcard dependencies
        run: npm run check:no-wildcard-deps

      - name: Check controller route prefixes
        run: npm run check:controller-prefixes
      - name: Check .env.example covers the env schema
        run: npm run check:env-example
      - name: Check AppModule imports resolve
        run: npm run check:app-module-imports

      - name: Run Linter
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit || true

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests || true
